<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#C2621A">
<title>JB IDOL Note</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --orange:#C2621A;--orange2:#e07830;--orange-bg:#FFF3EB;
  --k:#3E7FA8;--k-bg:#EBF5FF;
  --black:#111;--gray:#777;--gray2:#bbb;--light:#f5f5f7;--white:#fff;
  --border:#e8e8e8;
  --green:#16a34a;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --red:#ef4444;--red-bg:#fef2f2;--red-bd:#fecaca;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --purple:#7c3aed;--purple-bg:#f5f3ff;--purple-bd:#ddd6fe;
  --dance:#7B4FA0;--vocal:#1A6B5A;
}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--light);color:var(--black);min-height:100vh;overflow-x:hidden;font-size:15px}
.page{display:none;min-height:100vh;flex-direction:column}
.page.active{display:flex}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:900;color:var(--orange);letter-spacing:-1px}
.header-sub{font-size:11px;color:var(--gray);margin-top:1px}
.back-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 10px 4px 0;color:var(--black);line-height:1}
.header-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.sbtn{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--gray);font-family:inherit;white-space:nowrap}
.sbtn:active{background:var(--light)}
.sbtn.orange{background:var(--orange);border-color:var(--orange);color:var(--white);font-weight:700}
.sbtn.danger{border-color:var(--red-bd);color:var(--red)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;background:none;border:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10px;color:var(--gray2);font-family:inherit}
.nav-btn.active{color:var(--orange)}
.nav-icon{font-size:20px;line-height:1.2}
.content{flex:1;padding:12px 12px 90px}
.card{background:var(--white);border-radius:14px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.card-head{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:8px}
.card-title{font-size:14px;font-weight:700}
.card-body{padding:13px 14px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.orange{background:var(--orange-bg);color:var(--orange)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.gray{background:var(--light);color:var(--gray);border:1px solid var(--border)}
.badge.purple{background:var(--purple-bg);color:var(--purple)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.k{background:var(--k-bg);color:var(--k)}
.badge.dance{background:#EFE4F8;color:var(--dance)}
.badge.vocal{background:#D4F0E8;color:var(--vocal)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--white);color:var(--black);outline:none;transition:border .15s;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
textarea{resize:vertical;min-height:80px}
.form-row{margin-bottom:11px}
.form-label{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:4px;display:block}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-orange{background:var(--orange);color:var(--white)}
.btn-orange:active{background:var(--orange2)}
.btn-outline{background:var(--white);color:var(--orange);border:1.5px solid var(--orange)}
.btn-gray{background:var(--light);color:var(--black);border:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column}
.modal-head{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:16px;font-weight:800}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray);line-height:1;font-family:inherit}
.modal-body{overflow-y:auto;flex:1;padding:13px 17px}
.modal-foot{padding:13px 17px;border-top:1px solid var(--border);flex-shrink:0}
.lock-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;background:linear-gradient(160deg,var(--orange-bg),#f5f5f7)}
.lock-logo{font-size:26px;font-weight:900;color:var(--orange);letter-spacing:-1px;margin-bottom:3px}
.lock-sub{font-size:12px;color:var(--gray);margin-bottom:24px}
.lock-avatar{width:76px;height:76px;border-radius:50%;background:var(--orange-bg);border:3px solid var(--orange);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;font-weight:700;color:var(--orange)}
.lock-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.lock-box{background:var(--white);border-radius:20px;border:1px solid var(--border);padding:20px;width:100%;max-width:320px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:12px 0}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--gray2);transition:all .15s}
.pin-dot.filled{background:var(--orange);border-color:var(--orange)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.pin-key{background:var(--light);border:1px solid var(--border);border-radius:11px;padding:14px;font-size:20px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.pin-key:active{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}
.error-msg{color:var(--red);font-size:12px;text-align:center;min-height:17px;margin-top:3px}
.tab-bar{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--white)}
.tab-btn{padding:10px 15px;border:none;background:none;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;flex-shrink:0}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange)}
.adm-section{background:var(--white);border-radius:13px;border:1px solid var(--border);margin-bottom:11px;overflow:hidden}
.adm-row{padding:11px 13px;display:flex;align-items:center;border-bottom:1px solid var(--border);gap:9px}
.adm-row:last-child{border-bottom:none}
.del-btn{background:none;border:1px solid var(--red-bd);color:var(--red);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}
.edt-btn{background:none;border:1px solid var(--border);color:var(--gray);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}
.add-row{padding:9px 13px;display:flex;gap:6px;border-top:1px solid var(--border);flex-wrap:wrap}
.add-row input,.add-row select{flex:1;min-width:70px;padding:8px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:var(--white);outline:none}
.add-row input:focus,.add-row select:focus{border-color:var(--orange)}
.add-row button{background:var(--orange);color:var(--white);border:none;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.empty-msg{text-align:center;padding:26px;color:var(--gray);font-size:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--orange-bg);border:2px solid var(--orange2);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0;font-weight:700;color:var(--orange)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.kids{background:var(--k-bg);border-color:var(--k);color:var(--k)}
.profile-avatar-wrap{width:86px;height:86px;border-radius:50%;background:var(--orange-bg);border:3px solid var(--orange);margin:0 auto 11px;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;position:relative;cursor:pointer;font-weight:700;color:var(--orange)}
.profile-avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.notice-bar{background:linear-gradient(135deg,var(--orange-bg),#fce7d8);border:1px solid #f5c6a0;border-radius:12px;padding:11px 13px;margin-bottom:10px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}
.hint-box{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:9px;padding:9px 11px;margin-bottom:9px;font-size:12px;color:var(--amber);line-height:1.5}
.notice-content{font-size:15px;line-height:1.8;color:var(--black);white-space:pre-wrap}
.postit-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 4px}
.postit{min-height:110px;border-radius:3px;padding:11px 10px 9px;position:relative;box-shadow:2px 3px 8px rgba(0,0,0,.13);display:flex;flex-direction:column;cursor:pointer;transition:transform .15s}
.postit:active{transform:scale(0.97)}
.postit::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.08);border-radius:3px 3px 0 0}
.postit-author{font-size:11px;font-weight:800;margin-bottom:6px;opacity:.8}
.postit-content{font-size:12px;line-height:1.5;flex:1;word-break:break-all}
.postit-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.postit-time{font-size:10px;opacity:.6}
.postit-reply-cnt{font-size:10px;font-weight:700;opacity:.75}
.reply-item{padding:8px 12px;background:var(--light);border-radius:8px;margin-bottom:5px;display:flex;gap:8px;align-items:flex-start}
.reply-author{font-size:12px;font-weight:800;flex-shrink:0}
.reply-content{font-size:12px;color:var(--black);line-height:1.5;flex:1}
.reply-time{font-size:10px;color:var(--gray2);flex-shrink:0}
.sec-title{font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px}
.fw7{font-weight:700}.fw8{font-weight:800}.text-sm{font-size:12px}.text-gray{color:var(--gray)}.text-orange{color:var(--orange)}.mt6{margin-top:6px}.mt10{margin-top:10px}
.divider{height:1px;background:var(--border);margin:12px 0}
/* class tab */
.class-tab-bar{display:flex;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)}
.class-tab-btn{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;background:transparent;border:none;font-family:inherit;color:var(--gray);transition:all .15s}
.class-tab-btn.active-a{background:var(--orange);color:white}
.class-tab-btn.active-k{background:var(--k);color:white}
/* class chips */
.chip-dance{display:inline-block;background:#EFE4F8;border:1px solid #d4b8f0;border-radius:7px;padding:3px 9px;font-size:12px;margin:2px}
.chip-vocal{display:inline-block;background:#D4F0E8;border:1px solid #a0d8c8;border-radius:7px;padding:3px 9px;font-size:12px;margin:2px}
/* ib table */
.ib-table{width:100%;border-collapse:collapse;font-size:12px}
.ib-table th{padding:7px 7px;background:var(--light);font-weight:700;color:var(--gray);border-bottom:2px solid var(--border);text-align:left;white-space:nowrap}
.ib-table td{padding:8px 7px;border-bottom:1px solid var(--border);vertical-align:middle}
.ib-table tr:last-child td{border-bottom:none}
/* profile cls grid */
.cls-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cls-item{background:var(--light);border-radius:9px;padding:9px 11px;border:1.5px solid var(--border);cursor:pointer;min-height:60px}
.cls-item:active,.cls-item.selected{background:var(--orange-bg);border-color:var(--orange)}
.cls-lbl{font-size:10px;color:var(--gray);margin-bottom:3px;font-weight:700}
.cls-val{font-size:13px;font-weight:700;color:var(--black);line-height:1.3}
.cls-val.empty{color:var(--gray2);font-weight:400;font-size:12px}
.cls-teacher{font-size:11px;color:var(--orange);margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>

<!-- 로딩 -->
<div id="loading-overlay" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
  <div style="font-size:28px;font-weight:900;color:var(--orange);letter-spacing:-1px">JB IDOL</div>
  <div style="font-size:13px;color:#888">오디션반 관리 시스템</div>
  <div style="width:36px;height:36px;border:3px solid #f5c6a0;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite"></div>
</div>

<!-- ===== MAIN ===== -->
<div id="page-main" class="page active">
  <div class="header">
    <div><div class="logo">JB IDOL</div><div class="header-sub">오디션반 관리 시스템</div></div>
    <div class="header-right">
      <button class="sbtn" id="refresh-btn" onclick="refreshData()" style="font-size:16px">🔄</button>
      <button class="sbtn" onclick="showPage('page-schedule')">📅</button>
      <button class="sbtn" onclick="goAdmin()">⚙️</button>
    </div>
  </div>
  <div class="content">
    <div id="notice-bar-wrap"></div>
    <div id="events-bar-wrap"></div>
    <div id="resource-board-wrap"></div>
    <div id="message-board-wrap"></div>
    <div id="student-list-wrap"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('page-main')"><span class="nav-icon">🏠</span>명단</button>
    <button class="nav-btn" onclick="showPage('page-schedule')"><span class="nav-icon">📅</span>스케줄</button>
    <button class="nav-btn" onclick="goAdmin()"><span class="nav-icon">⚙️</span>관리</button>
  </div>
</div>

<!-- ===== SCHEDULE ===== -->
<div id="page-schedule" class="page">
  <div class="header">
    <button class="back-btn" onclick="showPage('page-main')">←</button>
    <div><div class="logo">스케줄</div><div class="header-sub">연간 행사 일정</div></div>
  </div>
  <div class="content">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px" id="year-cal"></div>
    <div class="sec-title">📌 행사 목록</div>
    <div id="event-list"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="showPage('page-main')"><span class="nav-icon">🏠</span>명단</button>
    <button class="nav-btn active" onclick="showPage('page-schedule')"><span class="nav-icon">📅</span>스케줄</button>
    <button class="nav-btn" onclick="goAdmin()"><span class="nav-icon">⚙️</span>관리</button>
  </div>
</div>

<!-- ===== STUDENT LOCK ===== -->
<div id="page-student-lock" class="page">
  <div class="lock-screen">
    <div class="lock-logo">JB IDOL</div><div class="lock-sub">개인 페이지</div>
    <div class="lock-avatar" id="lock-avatar">👤</div>
    <div style="font-size:20px;font-weight:900;text-align:center;margin-bottom:18px" id="lock-name">-</div>
    <div class="lock-box">
      <div style="text-align:center;font-size:13px;color:var(--gray);margin-bottom:9px">비밀번호 4자리 입력</div>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
      </div>
      <div class="error-msg" id="pin-err"></div>
      <div class="pin-pad">
        <button class="pin-key" onclick="pinIn('1')">1</button><button class="pin-key" onclick="pinIn('2')">2</button><button class="pin-key" onclick="pinIn('3')">3</button>
        <button class="pin-key" onclick="pinIn('4')">4</button><button class="pin-key" onclick="pinIn('5')">5</button><button class="pin-key" onclick="pinIn('6')">6</button>
        <button class="pin-key" onclick="pinIn('7')">7</button><button class="pin-key" onclick="pinIn('8')">8</button><button class="pin-key" onclick="pinIn('9')">9</button>
        <button class="pin-key" onclick="pinClr()" style="font-size:12px">지우기</button>
        <button class="pin-key" onclick="pinIn('0')">0</button>
        <button class="pin-key" onclick="pinBk()" style="font-size:18px">⌫</button>
      </div>
    </div>
    <button class="btn btn-gray" style="max-width:320px;margin-top:13px" onclick="showPage('page-main')">← 돌아가기</button>
  </div>
</div>

<!-- ===== PROFILE ===== -->
<div id="page-profile" class="page">
  <div class="header">
    <button class="back-btn" onclick="showPage('page-main')">←</button>
    <div><div class="logo" id="profile-hd">-</div><div class="header-sub">개인 페이지</div></div>
  </div>
  <!-- 프로필 탭 -->
  <div class="tab-bar" id="profile-tabs">
    <button class="tab-btn active" onclick="profileTab(0)">📋 기본정보</button>
    <button class="tab-btn" onclick="profileTab(1)">🎬 오디션 피드백</button>
    <button class="tab-btn" onclick="profileTab(2)">💃 댄스 레파토리</button>
    <button class="tab-btn" onclick="profileTab(3)">🎤 보컬 레파토리</button>
    <button class="tab-btn" onclick="profileTab(4)">📊 인바디</button>
  </div>
  <div class="content" id="profile-content"></div>
</div>

<!-- ===== ADMIN LOCK ===== -->
<div id="page-admin-lock" class="page">
  <div class="lock-screen">
    <div class="lock-logo">JB IDOL</div><div class="lock-sub">관리자 페이지</div>
    <div style="font-size:50px;margin-bottom:14px">🔐</div>
    <div class="lock-box">
      <div style="text-align:center;font-size:13px;color:var(--gray);margin-bottom:12px">관리자 비밀번호 입력</div>
      <div class="form-row"><input type="password" id="admin-pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkAdminPw()"></div>
      <div class="error-msg" id="admin-pw-err"></div>
      <button class="btn btn-orange" onclick="checkAdminPw()" style="margin-top:7px">로그인</button>
    </div>
    <button class="btn btn-gray" style="max-width:320px;margin-top:13px" onclick="showPage('page-main')">← 돌아가기</button>
  </div>
</div>

<!-- ===== ADMIN ===== -->
<div id="page-admin" class="page">
  <div class="header">
    <button class="back-btn" onclick="showPage('page-main')">←</button>
    <div><div class="logo">관리자</div><div class="header-sub">JB IDOL 오디션반</div></div>
    <div class="header-right"><button class="sbtn danger" onclick="adminOut()">로그아웃</button></div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="admTab(this,'students')">학생</button>
    <button class="tab-btn" onclick="admTab(this,'classes')">수업</button>
    <button class="tab-btn" onclick="admTab(this,'schedule')">스케줄</button>
    <button class="tab-btn" onclick="admTab(this,'notice')">공지</button>
    <button class="tab-btn" onclick="admTab(this,'resource')">영상/지식</button>
    <button class="tab-btn" onclick="admTab(this,'settings')">설정</button>
  </div>
  <div class="content" id="admin-content" style="padding-top:9px"></div>
</div>

// ═══ DATA ═══

let DB=window.DB;

// ═══ FIREBASE HELPERS ═══
async function fbSave(col,id,data){try{await db.collection(col).doc(String(id)).set(data);}catch(e){console.warn(col+' 저장 실패:',e);}}
async function fbDel(col,id){try{await db.collection(col).doc(String(id)).delete();}catch(e){}}
async function fbSaveConfig(){
  try{await db.collection('idol_config').doc('main').set({
    adminPw:DB.adminPw,notices:DB.notices||[],events:DB.events||[],
    danceClasses:DB.danceClasses||[],vocalClasses:DB.vocalClasses||[],
    updatedAt:Date.now()
  });}catch(e){console.warn('config 저장 실패:',e);}
}

async function loadAll(){
  try{
    // config
    const cSnap=await db.collection('idol_config').doc('main').get();
    if(cSnap.exists()){
      const c=cSnap.data();
      DB.adminPw=c.adminPw||DB.adminPw;
      DB.notices=c.notices||[];
      DB.events=c.events||[];
      if(c.danceClasses&&c.danceClasses.length) DB.danceClasses=c.danceClasses;
      if(c.vocalClasses&&c.vocalClasses.length) DB.vocalClasses=c.vocalClasses;
    } else {await fbSaveConfig();}
    // students
    const sSnap=await db.collection('idol_students').get();
    if(!sSnap.empty){DB.students=[];sSnap.forEach(d=>DB.students.push(d.data()));}
    else{for(const s of DB.students) await fbSave('idol_students',s.id,s);}
    // messages
    const mSnap=await db.collection('idol_messages').get();
    DB.messages=[];mSnap.forEach(d=>DB.messages.push(d.data()));
    DB.messages.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
    // resources
    try{const rSnap=await db.collection('idol_resources').get();DB.resources=[];rSnap.forEach(d=>DB.resources.push(d.data()));}catch(e){DB.resources=[];}
    window.DB=DB;
    console.log('✅ 로드 완료 - 학생',DB.students.length,'명');
  }catch(e){console.warn('Firebase 로드 실패:',e);}
  renderMain();
  const ov=document.getElementById('loading-overlay');
  if(ov){ov.style.opacity='0';ov.style.transition='opacity .3s';setTimeout(()=>ov.remove(),300);}
}
// message realtime
function startMsgSync(){
  db.collection('idol_messages').onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      const m=change.doc.data();
      if(change.type==='removed') DB.messages=DB.messages.filter(x=>x.id!==m.id);
      else{const i=DB.messages.findIndex(x=>x.id===m.id);if(i>=0)DB.messages[i]=m;else DB.messages.push(m);}
    });
    DB.messages.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
    if(document.getElementById('page-main').classList.contains('active')) renderMain();
  });
}
async function refreshData(){
  const btn=document.getElementById('refresh-btn');
  if(btn){btn.style.animation='spin .6s linear infinite';btn.disabled=true;}
  await loadAll();showToast('✅ 최신 데이터로 업데이트됐어요!');
  if(btn){btn.style.animation='';btn.disabled=false;}
}

// ═══ UTILS ═══
const POSTIT_COLORS=['#fef08a','#bbf7d0','#bfdbfe','#fecdd3','#e9d5ff','#fed7aa','#a5f3fc','#fde68a'];
function esc(s){if(!s) return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:9999;white-space:nowrap;pointer-events:none';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2500);}
function openM(id){document.getElementById(id).classList.add('active');}
function closeM(id){document.getElementById(id).classList.remove('active');}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='page-main') renderMain();
  if(id==='page-schedule') renderSchedule();
}
function today(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function nowTime(){const n=new Date();return (n.getMonth()+1)+'/'+n.getDate()+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}

// ═══ MAIN RENDER ═══
function renderMain(){
  renderNoticeBar();renderEventsBar();renderResourceBoard();renderMsgBoard();renderStudentList();
}
window.renderMain=renderMain;

// 공지사항
function renderNoticeBar(){
  const w=document.getElementById('notice-bar-wrap');if(!w) return;
  const notices=DB.notices||[];if(!notices.length){w.innerHTML='';return;}
  const showAll=window._noticeShowAll||false;
  const display=showAll?notices:notices.slice(0,3);
  let html='<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:800;color:var(--gray);margin-bottom:6px;padding:0 2px">📢 공지사항</div>';
  display.forEach((n,i)=>{
    html+=`<div onclick="viewNotice(${i})" style="background:var(--white);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:10px;padding:10px 13px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800;color:var(--orange)">${esc(n.title)}</div>
      <div style="font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((n.content||'').replace(/\n/g,' ').substring(0,40))}</div></div>
      <div style="color:var(--gray2);font-size:18px">›</div></div>`;
  });
  if(notices.length>3) html+=`<div style="text-align:center;margin-top:4px"><button onclick="window._noticeShowAll=!window._noticeShowAll;renderNoticeBar()" style="background:none;border:1px solid var(--border);border-radius:20px;padding:5px 16px;font-size:11px;color:var(--gray);cursor:pointer;font-family:inherit">${showAll?'▲ 접기':'▼ 더보기'}</button></div>`;
  html+='</div>';w.innerHTML=html;
}
function viewNotice(i){const n=(DB.notices||[])[i];if(!n) return;document.getElementById('notice-view-title').textContent=n.title;document.getElementById('notice-txt').textContent=n.content||'';openM('modal-notice');}

// 다가오는 행사
function renderEventsBar(){
  const w=document.getElementById('events-bar-wrap');if(!w) return;
  const now=new Date();const todayStr=today();
  const events=(DB.events||[]).filter(e=>e.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  if(!events.length){w.innerHTML='';return;}
  let html='<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:800;color:var(--gray);margin-bottom:6px;padding:0 2px">📅 다가오는 행사</div>';
  events.forEach(ev=>{
    const d=new Date(ev.date);const diff=Math.round((d-now)/(1000*60*60*24));
    const diffTxt=diff===0?'오늘':diff===1?'내일':diff+'일 후';
    const urgent=diff<=3;
    html+=`<div onclick="showPage('page-schedule')" style="background:var(--white);border:1px solid var(--border);border-left:3px solid ${urgent?'var(--red)':'var(--blue)'};border-radius:10px;padding:9px 13px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px">
      <div style="min-width:36px;text-align:center;font-size:10px;font-weight:800;color:${urgent?'var(--red)':'var(--blue)'}">${diffTxt}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:800">${esc(ev.name)}</div><div style="font-size:11px;color:var(--gray)">${ev.date}${ev.memo?' · '+esc(ev.memo):''}</div></div>

  const clsLabel=_activeClass==='audition'?'오디션반':'키즈오디션반';
  if(!list.length){w.innerHTML=html+'<div class="empty-msg">등록된 학생이 없습니다</div>';return;}

  list.sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach((s,i)=>{
    const lastIb=s.inbody&&s.inbody.length?s.inbody[s.inbody.length-1]:null;
    const dCnt=Object.keys(s.classes||{}).filter(k=>k.startsWith('d')).filter(k=>s.classes[k]).length;
    const vCnt=Object.keys(s.classes||{}).filter(k=>k.startsWith('v')).filter(k=>s.classes[k]).length;
    const total=dCnt+vCnt;
    const cardId='sc-'+s.id;
    const isKids=s.cls==='kids';
    html+=`<div class="card" style="margin-bottom:9px">
      <div style="padding:12px 13px;display:flex;align-items:center;gap:11px">
        <div style="font-size:12px;color:var(--gray2);min-width:19px;font-weight:700;text-align:center">${i+1}</div>
        <div class="avatar${isKids?' kids':''}" onclick="openStudentLock(${s.id})" style="cursor:pointer">${s.photo?`<img src="${s.photo}">`:`${s.name[0]}`}</div>
        <div style="flex:1;min-width:0;cursor:pointer" onclick="openStudentLock(${s.id})">
          <div style="font-size:16px;font-weight:800">${esc(s.name)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center">
            ${lastIb?`<span class="badge green">📊 ${lastIb.score}점</span>`:''}
            ${dCnt?`<span class="badge dance">💃 댄스 ${dCnt}</span>`:''}
            ${vCnt?`<span class="badge vocal">🎤 보컬 ${vCnt}</span>`:''}
            ${!lastIb&&!total?`<span class="badge gray">수업 미배정</span>`:''}
          </div>
        </div>
        ${total?`<button onclick="toggleStudentClasses('${cardId}')" id="btn-${cardId}" style="background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--gray);cursor:pointer;flex-shrink:0;font-family:inherit">▼ 수업</button>`:
        `<div style="color:var(--gray2);font-size:20px;cursor:pointer" onclick="openStudentLock(${s.id})">›</div>`}
      </div>
      ${total?`<div id="${cardId}" style="display:none;padding:9px 12px 11px;border-top:1px solid var(--border)">
        ${dCnt?renderClassChips(s,'dance'):''}
        ${vCnt?renderClassChips(s,'vocal'):''}
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
          <button onclick="openStudentLock(${s.id})" style="width:100%;background:var(--orange-bg);border:1px solid #f5c6a0;border-radius:8px;padding:7px;font-size:12px;font-weight:700;color:var(--orange);cursor:pointer;font-family:inherit">개인 페이지 →</button>
        </div>
      </div>`:''}
    </div>`;
  });
  w.innerHTML=html;
}
function switchClassTab(cls){_activeClass=cls;renderStudentList();}
function renderClassChips(s,type){
  const classes=type==='dance'?DB.danceClasses:DB.vocalClasses;
  const prefix=type==='dance'?'d':'v';
  const chips=[];
  Object.keys(s.classes||{}).filter(k=>k.startsWith(prefix)).forEach(k=>{
    const cid=s.classes[k];const c=classes.find(x=>x.id===cid);
    if(c) chips.push(c);
  });
  if(!chips.length) return '';
  const color=type==='dance'?'var(--dance)':'var(--vocal)';
  const bg=type==='dance'?'#EFE4F8':'#D4F0E8';
  const bd=type==='dance'?'#d4b8f0':'#a0d8c8';
  const label=type==='dance'?'💃 댄스':'🎤 보컬';
  return `<div style="font-size:10px;font-weight:800;color:${color};margin-bottom:5px">${label}</div>
  <div style="display:flex;flex-wrap:wrap;margin-bottom:8px">${chips.map(c=>{
    const t=c.day?` ${c.day}${c.timeStart?' '+c.timeStart:''}${c.timeEnd?'~'+c.timeEnd:''}`.trim():'';
    return `<span style="display:inline-block;background:${bg};border:1px solid ${bd};border-radius:7px;padding:3px 9px;font-size:12px;margin:2px"><span style="font-weight:700;color:var(--black)">${esc(c.name)}</span><span style="color:${color};font-size:11px"> · ${esc(c.teacher)}</span>${t?`<span style="color:var(--gray);font-size:10px"> ${t}</span>`:''}</span>`;
  }).join('')}</div>`;
}
function toggleStudentClasses(cardId){
  const el=document.getElementById(cardId);const btn=document.getElementById('btn-'+cardId);
  if(!el) return;const isOpen=el.style.display!=='none';
  el.style.display=isOpen?'none':'block';if(btn) btn.textContent=isOpen?'▼ 수업':'▲ 닫기';
}

function pinIn(d){if(pinVal.length>=4) return;pinVal+=d;updPin();if(pinVal.length===4) setTimeout(chkPin,200);}

function pinClr(){pinVal='';updPin();}
function updPin(){for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled',i<pinVal.length);}
function chkPin(){
  const s=DB.students.find(x=>x.id===curSid);

  else{document.getElementById('pin-err').textContent='비밀번호가 틀렸습니다';pinVal='';updPin();setTimeout(()=>document.getElementById('pin-err').textContent='',2000);}

function renderClsGrid(s,type){
  const classes=type==='dance'?DB.danceClasses:DB.vocalClasses;

  const slots=[{key:prefix+'0',label:'수업1'},{key:prefix+'1',label:'수업2'},{key:prefix+'2',label:'수업3'}];
  return slots.map(slot=>{
    const sel=s.classes&&s.classes[slot.key];
    const cls=sel?classes.find(x=>x.id===sel):null;
    const t=cls&&cls.day?`${cls.day}${cls.timeStart?' '+cls.timeStart:''}${cls.timeEnd?'~'+cls.timeEnd:''}`:'';
    return `<div class="cls-item${cls?' selected':''}" onclick="openClsModal(${s.id},'${slot.key}','${slot.label}','${type}')">
      <div class="cls-lbl">${slot.label}</div>
      ${cls?`<div class="cls-val">${esc(cls.name)}</div><div class="cls-teacher">• ${esc(cls.teacher)}</div>${t?`<div style="font-size:10px;color:var(--gray);margin-top:2px">⏰ ${t}</div>`:''}`
           :`<div class="cls-val empty">탭하여 선택</div>`}
    </div>`;
  }).join('');
}

// 오디션 피드백 탭 (기존 Firebase 데이터)
async function renderAuditionFeedbacks(s,container){
  container.innerHTML='<div style="padding:20px;text-align:center;color:var(--gray)">불러오는 중...</div>';
  try{
    const snap=await db.collection('feedbacks').get();
    const all=[];snap.forEach(d=>all.push({id:d.id,...d.data()}));
    const mine=all.filter(f=>f.name===s.name).sort((a,b)=>(b.ts||0)-(a.ts||0));
    if(!mine.length){container.innerHTML='<div class="empty-msg" style="padding:40px">아직 오디션 피드백이 없어요</div>';return;}
    const groups={};
    mine.forEach(f=>{const k=(f.date||'')+'|'+(f.agency||'');if(!groups[k])groups[k]=[];groups[k].push(f);});
    let html='';
    Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,items])=>{
      const [date,agency]=k.split('|');
      html+=`<div style="font-size:12px;font-weight:800;color:var(--gray);margin:14px 0 7px;display:flex;align-items:center;gap:8px">${date} · ${agency}<div style="flex:1;height:1px;background:var(--border)"></div></div>`;
      items.forEach(f=>{
        const hasD=f.dText;const hasV=f.vMain;
        html+=`<div class="card" style="margin-bottom:9px">
          <div style="padding:12px 14px">
            ${f.videoDance||f.videoLink?`<a href="${f.videoDance||f.videoLink}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:#EFE4F8;color:var(--dance);font-size:12px;font-weight:700;border-radius:8px;text-decoration:none;margin-bottom:8px">💃 댄스 영상 ↗</a>`:''}

// 프로필 사진
function handleProfileImg(inp){
  const file=inp.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const s=DB.students.find(x=>x.id===curSid);if(!s) return;
    try{
      const ref=storage.ref('idol_profiles/'+curSid+'.jpg');
      await ref.putString(e.target.result,'data_url');
      s.photo=await ref.getDownloadURL();
    }catch(err){s.photo=e.target.result;}
    fbSave('idol_students',s.id,s);renderProfileTab(s,0);showToast('✅ 사진 저장됨');
  };
  reader.readAsDataURL(file);
}

// ═══ SCHEDULE ═══
function renderSchedule(){
  const evEl=document.getElementById('event-list');
  const cal=document.getElementById('year-cal');
  const events=(DB.events||[]).sort((a,b)=>a.date.localeCompare(b.date));
  if(!events.length){evEl.innerHTML='<div class="empty-msg">등록된 행사가 없어요</div>';cal.innerHTML='';return;}
  const now=new Date();
  evEl.innerHTML=events.map(ev=>{
    const d=new Date(ev.date);const diff=Math.round((d-now)/(1000*60*60*24));
    const past=diff<0;
    return `<div style="background:var(--white);border-radius:12px;border:1px solid var(--border);padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;opacity:${past?0.5:1}">
      <div style="text-align:center;min-width:42px;background:${past?'var(--light)':'var(--orange-bg)'};border-radius:10px;padding:6px 4px">
        <div style="font-size:16px;font-weight:900;color:${past?'var(--gray)':'var(--orange)'}">${d.getDate()}</div>
        <div style="font-size:10px;font-weight:700;color:${past?'var(--gray2)':'var(--orange)'}">${d.getMonth()+1}월</div>
      </div>
      <div style="flex:1"><div style="font-size:14px;font-weight:800">${esc(ev.name)}</div>
      ${ev.memo?`<div style="font-size:12px;color:var(--gray);margin-top:2px">${esc(ev.memo)}</div>`:''}
      <div style="font-size:11px;color:${past?'var(--gray2)':diff<=3?'var(--red)':'var(--blue)'};margin-top:3px">${past?'지남':diff===0?'오늘!':diff===1?'내일':diff+'일 후'}</div></div>
      ${isAdmin?`<button onclick="delEv('${ev.id}')" class="del-btn">삭제</button>`:''}
    </div>`;
  }).join('');
}

// ═══ ADMIN ═══
function goAdmin(){showPage('page-admin-lock');document.getElementById('admin-pw-input').value='';document.getElementById('admin-pw-err').textContent='';}
function checkAdminPw(){
  const pw=document.getElementById('admin-pw-input').value;
  if(pw===DB.adminPw){isAdmin=true;showPage('page-admin');admTab(document.querySelector('#page-admin .tab-btn'),'students');}
  else{document.getElementById('admin-pw-err').textContent='비밀번호가 틀렸습니다';}
}
function adminOut(){isAdmin=false;showPage('page-main');}
let admTab_='students';
function admTab(btn,tab){
  admTab_=tab;
  document.querySelectorAll('#page-admin .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAdmContent();
}
function renderAdmContent(){
  const c=document.getElementById('admin-content');
  if(admTab_==='students') renderAdmStudents(c);
  else if(admTab_==='classes') renderAdmClasses(c);
  else if(admTab_==='schedule') renderAdmSchedule(c);
  else if(admTab_==='notice') renderAdmNotice(c);
  else if(admTab_==='resource') renderAdmResource(c);
  else if(admTab_==='settings') renderAdmSettings(c);
}
function renderAdmStudents(c){
  const aud=DB.students.filter(s=>s.cls==='audition'||!s.cls);
  const kids=DB.students.filter(s=>s.cls==='kids');
  let html='<button class="btn btn-orange" onclick="openM(\'modal-add-s\')" style="margin-bottom:14px">+ 학생 추가</button>';
  ['오디션반','키즈오디션반'].forEach((label,li)=>{
    const list=li===0?aud:kids;
    html+=`<div class="sec-title">${label} (${list.length}명)</div><div class="adm-section">`;
    list.sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach(s=>{
      html+=`<div class="adm-row">
        <div class="avatar${li===1?' kids':''}" style="width:34px;height:34px;font-size:14px">${s.photo?`<img src="${s.photo}">`:`${s.name[0]}`}</div>
        <div style="flex:1"><div style="font-weight:800">${esc(s.name)}</div><div style="font-size:12px;color:var(--gray)">비번: ${s.pw||'미설정'}</div></div>
        <button onclick="openTeacherMsg(${s.id})" class="edt-btn">💌</button>
        <button onclick="openPwModal(${s.id})" class="edt-btn">비번</button>
        <button onclick="delStudent(${s.id})" class="del-btn">삭제</button>
      </div>`;
    });
    html+='</div>';
  });
  c.innerHTML=html;
}
function addStudent(){
  const name=document.getElementById('ns-name').value.trim();
  const cls=document.getElementById('ns-class').value;
  const birth=document.getElementById('ns-birth').value;
  const pw=document.getElementById('ns-pw').value;
  if(!name){alert('이름을 입력해주세요');return;}
  const newId=Date.now();
  const s={id:newId,name,cls,birth,pw:pw||'0000',photo:'',classes:{},inbody:[],teacherMessages:[]};
  DB.students.push(s);fbSave('idol_students',s.id,s);
  closeM('modal-add-s');renderAdmContent();renderStudentList();showToast('✅ '+name+' 추가됨');
}
function delStudent(id){
  const s=DB.students.find(x=>x.id===id);if(!s) return;
  if(!confirm(s.name+' 학생을 삭제할까요?')) return;
  DB.students=DB.students.filter(x=>x.id!==id);fbDel('idol_students',id);
  renderAdmContent();renderStudentList();showToast('✅ 삭제됨');
}
function openPwModal(sid){
  window._pwSid=sid;const s=DB.students.find(x=>x.id===sid);
  document.getElementById('pw-sname').textContent=s?s.name:'';
  document.getElementById('new-pw').value='';openM('modal-pw');
}
function saveStudentPw(){
  const pw=document.getElementById('new-pw').value;
  if(pw.length!==4||isNaN(pw)){alert('4자리 숫자를 입력해주세요');return;}
  const s=DB.students.find(x=>x.id===window._pwSid);if(!s) return;
  s.pw=pw;fbSave('idol_students',s.id,s);closeM('modal-pw');showToast('✅ 비밀번호 변경됨');renderAdmContent();
}

function renderAdmClasses(c){
  let html='<div class="sec-title">💃 댄스 수업</div><div class="adm-section">';
  (DB.danceClasses||[]).forEach((cl,i)=>{
    html+=`<div class="adm-row">
      <div style="flex:1"><div style="font-weight:800">${esc(cl.name)}</div><div style="font-size:12px;color:var(--gray)">${esc(cl.teacher)}${cl.day?' · '+cl.day:''}${cl.timeStart?' '+cl.timeStart:''}</div></div>
      <button onclick="delClass('dance',${i})" class="del-btn">삭제</button>
    </div>`;
  });
  html+=`<div class="add-row">
    <input type="text" id="dc-name" placeholder="수업명" style="flex:2">
    <input type="text" id="dc-teacher" placeholder="선생님">
    <input type="text" id="dc-day" placeholder="요일" style="width:50px;flex:none">
    <input type="text" id="dc-time" placeholder="시간" style="flex:1">
    <button onclick="addDanceClass()">+ 추가</button>
  </div></div>`;
  html+='<div class="sec-title">🎤 보컬 수업</div><div class="adm-section">';
  (DB.vocalClasses||[]).forEach((cl,i)=>{
    html+=`<div class="adm-row">
      <div style="flex:1"><div style="font-weight:800">${esc(cl.name)}</div><div style="font-size:12px;color:var(--gray)">${esc(cl.teacher)}${cl.day?' · '+cl.day:''}${cl.timeStart?' '+cl.timeStart:''}</div></div>
      <button onclick="delClass('vocal',${i})" class="del-btn">삭제</button>
    </div>`;
  });
  html+=`<div class="add-row">
    <input type="text" id="vc-name" placeholder="수업명" style="flex:2">
    <input type="text" id="vc-teacher" placeholder="선생님">
    <input type="text" id="vc-day" placeholder="요일" style="width:50px;flex:none">
    <input type="text" id="vc-time" placeholder="시간" style="flex:1">
    <button onclick="addVocalClass()">+ 추가</button>
  </div></div>`;
  c.innerHTML=html;
}
function addDanceClass(){
  const name=document.getElementById('dc-name').value.trim();if(!name) return;
  const cl={id:'d'+Date.now(),name,teacher:document.getElementById('dc-teacher').value,day:document.getElementById('dc-day').value,timeStart:document.getElementById('dc-time').value,timeEnd:''};
  DB.danceClasses.push(cl);fbSaveConfig();renderAdmContent();showToast('✅ 댄스 수업 추가됨');
}
function addVocalClass(){
  const name=document.getElementById('vc-name').value.trim();if(!name) return;
  const cl={id:'v'+Date.now(),name,teacher:document.getElementById('vc-teacher').value,day:document.getElementById('vc-day').value,timeStart:document.getElementById('vc-time').value,timeEnd:''};
  DB.vocalClasses.push(cl);fbSaveConfig();renderAdmContent();showToast('✅ 보컬 수업 추가됨');
}
function delClass(type,i){
  if(!confirm('삭제할까요?')) return;
  if(type==='dance') DB.danceClasses.splice(i,1);else DB.vocalClasses.splice(i,1);
  fbSaveConfig();renderAdmContent();showToast('✅ 삭제됨');
}

function renderAdmSchedule(c){
  const events=(DB.events||[]).sort((a,b)=>a.date.localeCompare(b.date));
  c.innerHTML=`<button class="btn btn-orange" onclick="openEvModal()" style="margin-bottom:14px">+ 행사 추가</button>
  <div class="adm-section">
    ${events.map(ev=>`<div class="adm-row">
      <div style="flex:1"><div style="font-weight:800">${esc(ev.name)}</div><div style="font-size:12px;color:var(--gray)">${ev.date}${ev.memo?' · '+esc(ev.memo):''}</div></div>
      <button onclick="delEv('${ev.id}')" class="del-btn">삭제</button>
    </div>`).join('')}
    ${!events.length?'<div class="empty-msg">행사가 없어요</div>':''}
  </div>`;
}
let editEvId2=null;
function openEvModal(){editEvId2=null;document.getElementById('ev-title').textContent='행사 추가';document.getElementById('ev-date').value=today();document.getElementById('ev-name').value='';document.getElementById('ev-memo').value='';openM('modal-ev');}
function saveEv(){
  const date=document.getElementById('ev-date').value;const name=document.getElementById('ev-name').value.trim();
  if(!date||!name){alert('날짜와 행사명을 입력해주세요');return;}
  const ev={id:'e'+Date.now(),date,name,memo:document.getElementById('ev-memo').value};
  if(!DB.events) DB.events=[];DB.events.push(ev);fbSaveConfig();closeM('modal-ev');
  renderAdmContent();renderSchedule();showToast('✅ 행사 추가됨');
}
function delEv(id){if(!confirm('삭제할까요?')) return;DB.events=(DB.events||[]).filter(e=>e.id!==id);fbSaveConfig();renderAdmContent();renderSchedule();showToast('✅ 삭제됨');}

function renderAdmNotice(c){
  const notices=DB.notices||[];
  c.innerHTML=`<div class="adm-section">
    ${notices.map((n,i)=>`<div class="adm-row">
      <div style="flex:1"><div style="font-weight:800">${esc(n.title)}</div><div style="font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">${esc((n.content||'').substring(0,40))}</div></div>
      <button onclick="delNotice(${i})" class="del-btn">삭제</button>
    </div>`).join('')}
    ${!notices.length?'<div class="empty-msg">공지가 없어요</div>':''}
  </div>
  <div style="margin-top:12px;background:var(--white);border-radius:13px;border:1px solid var(--border);padding:13px">
    <div class="form-row"><label class="form-label">제목</label><input type="text" id="notice-title" placeholder="공지 제목"></div>
    <div class="form-row"><label class="form-label">내용</label><textarea id="notice-content" placeholder="공지 내용" style="min-height:100px"></textarea></div>
    <button class="btn btn-orange" onclick="addNotice()">공지 추가</button>
  </div>`;
}
function addNotice(){
  const title=document.getElementById('notice-title').value.trim();const content=document.getElementById('notice-content').value.trim();
  if(!title){alert('제목을 입력해주세요');return;}
  if(!DB.notices) DB.notices=[];DB.notices.push({id:'n'+Date.now(),title,content,date:today()});
  fbSaveConfig();renderAdmContent();renderNoticeBar();showToast('✅ 공지 추가됨');
}
function delNotice(i){if(!confirm('삭제할까요?')) return;(DB.notices||[]).splice(i,1);fbSaveConfig();renderAdmContent();renderNoticeBar();}

function renderAdmResource(c){
  const res=(DB.resources||[]).slice().reverse();
  c.innerHTML=`<div class="adm-section">
    ${res.map(r=>`<div class="adm-row">
      <div style="flex:1"><div style="font-weight:800;font-size:13px">${esc(r.title)}</div><div style="font-size:11px;color:var(--gray)">${r.url?r.url.substring(0,30)+'…':'텍스트'}</div></div>
      <button onclick="delResource('${r.id}')" class="del-btn">삭제</button>
    </div>`).join('')}
    ${!res.length?'<div class="empty-msg">등록된 자료가 없어요</div>':''}
  </div>
  <div style="margin-top:12px;background:var(--white);border-radius:13px;border:1px solid var(--border);padding:13px">
    <div class="form-row"><label class="form-label">제목</label><input type="text" id="res-title" placeholder="제목"></div>
    <div class="form-row"><label class="form-label">URL (유튜브/링크)</label><input type="text" id="res-url" placeholder="https://..."></div>
    <div class="form-row"><label class="form-label">내용 (선택)</label><textarea id="res-content" placeholder="설명 또는 본문" style="min-height:80px"></textarea></div>
    <button class="btn btn-orange" onclick="addResource()">자료 추가</button>
  </div>`;
}
function addResource(){
  const title=document.getElementById('res-title').value.trim();if(!title){alert('제목을 입력해주세요');return;}
  const r={id:'res'+Date.now(),title,url:document.getElementById('res-url').value.trim(),content:document.getElementById('res-content').value.trim(),time:today(),comments:[]};
  if(!DB.resources) DB.resources=[];DB.resources.push(r);
  fbSave('idol_resources',r.id,r);renderAdmContent();renderResourceBoard();showToast('✅ 자료 추가됨');
}
function delResource(id){if(!confirm('삭제할까요?')) return;DB.resources=(DB.resources||[]).filter(x=>x.id!==id);fbDel('idol_resources',id);renderAdmContent();renderResourceBoard();}

function renderAdmSettings(c){
  c.innerHTML=`<div class="adm-section">
    <div class="adm-row">
      <div style="flex:1"><div style="font-weight:800">관리자 비밀번호</div><div style="font-size:12px;color:var(--gray)">현재: ${DB.adminPw}</div></div>
    </div>
    <div class="add-row">
      <input type="password" id="new-admin-pw" placeholder="새 비밀번호">
      <button onclick="changeAdminPw()">변경</button>
    </div>
  </div>
  <div class="adm-section" style="margin-top:12px">
    <div class="adm-row">
      <div style="flex:1;font-weight:800">전체 메시지 보내기</div>
      <button onclick="openM('modal-broadcast')" class="edt-btn">📢 전송</button>
    </div>
  </div>`;
}
function changeAdminPw(){
  const pw=document.getElementById('new-admin-pw').value.trim();if(!pw){alert('비밀번호를 입력해주세요');return;}
  DB.adminPw=pw;fbSaveConfig();showToast('✅ 관리자 비밀번호 변경됨');renderAdmContent();
}
function sendBroadcast(){
  const name=(document.getElementById('broadcast-teacher-name').value||'').trim();
  const content=document.getElementById('broadcast-content').value.trim();
  if(!name||!content){alert('이름과 메시지를 입력해주세요');return;}
  if(!confirm('모든 학생 '+DB.students.length+'명에게 전송할까요?')) return;
  DB.students.forEach(s=>{
    if(!s.teacherMessages) s.teacherMessages=[];
    s.teacherMessages.push({id:'tm'+Date.now()+Math.random(),content:'['+name+'] '+content,date:nowTime(),read:false});
    fbSave('idol_students',s.id,s);
  });
  showToast('✅ 전송 완료');closeM('modal-broadcast');
}

// ═══ INIT ═══
window.addEventListener('load',async()=>{
  await new Promise(r=>setTimeout(r,200));
  await loadAll();
  startMsgSync();
});
</script>
