<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 오디션 소식 · JB IDOL Note</title>
<style>
  body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:#FAF7FF;color:#6B3FA0}
  .ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;padding:24px;text-align:center}
  .sp{width:44px;height:44px;border:4px solid #EEE6FB;border-top-color:#8B3FA0;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ld p{font-weight:700;margin:0}
</style>
</head>
<body>
<div class="ld" id="ld"><div class="sp"></div><p>오늘의 오디션 소식을 불러오는 중… ✨</p></div>
<script>
fetch('brief.html?t=' + Date.now(), {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .then(function(h){ document.open(); document.write(h); document.close(); })
  .catch(function(){ document.getElementById('ld').innerHTML='<p>소식을 불러오지 못했어요.<br>잠시 후 새로고침해 주세요. 🙏</p>'; });
</script>
</body>
</html>
